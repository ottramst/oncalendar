name: Feature request
description: Suggest a new feature or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like the library to do, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Proposed usage
      description: Optional. How you would like to call it.
      render: ts
  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional. Links to specifications, reference implementations, or related issues.
