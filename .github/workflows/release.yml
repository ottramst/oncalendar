# npm release workflow.
name: Release

# Publishes to npm and creates a GitHub release when a tag that matches the
# pattern "v*" (e.g. v0.1.0) is pushed. npm authenticates through trusted
# publishing (OIDC), so no npm token is stored; provenance is attached automatically.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deployment protection rules on the environment restrict releases to v* tags.
    environment: release
    permissions:
      # Creating the GitHub release
      contents: write
      # npm trusted publishing and provenance
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          # don't let a cache poisoned elsewhere into a release build
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version."
            exit 1
          fi
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - name: Publish to npm
        run: npm publish --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release notes are the CHANGELOG.md section for this version.
          awk -v heading="## $TAG" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
